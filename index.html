<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;}
html,body{width:100%;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',sans-serif;background:#c8c9a8;}
#desktop{width:100%;height:100vh;position:relative;overflow:hidden;}
#wallpaper{position:absolute;inset:0;background-image:url('Wallpaper.jpg');background-size:cover;background-position:center;background-color:#c8c9a8;}

#menubar-left{display:flex;align-items:center;gap:18px;}
#menubar-right{display:flex;align-items:center;gap:14px;font-size:12px;}
.folder-icon{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:8px;border-radius:8px;width:90px;transition:background 0.15s;}
.folder-icon:hover{background:rgba(255,255,255,0.22);}
.folder-label{font-size:12px;color:white;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,0.9),0 0 12px rgba(0,0,0,0.6);font-weight:500;line-height:1.3;}

.dock-app{width:54px;height:54px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.12s ease;flex-shrink:0;position:relative;}
.dock-app:hover{transform:translateY(-14px) scale(1.28);}
.dock-app img{width:52px;height:52px;border-radius:13px;object-fit:cover;}
.dock-sep{width:1px;height:40px;background:rgba(255,255,255,0.38);margin:0 3px;align-self:center;}
.window{position:absolute;background:rgba(242,242,238,0.98);border-radius:12px;border:0.5px solid rgba(0,0,0,0.18);box-shadow:0 24px 80px rgba(0,0,0,0.45),0 0 0 0.5px rgba(255,255,255,0.3) inset;z-index:200;display:flex;flex-direction:column;overflow:hidden;}
.window-titlebar{height:40px;background:rgba(232,232,228,0.99);display:flex;align-items:center;padding:0 14px;gap:8px;border-bottom:0.5px solid rgba(0,0,0,0.1);cursor:grab;flex-shrink:0;}
.window-titlebar:active{cursor:grabbing;}
.traffic-lights{display:flex;gap:8px;align-items:center;}
.tl{width:12px;height:12px;border-radius:50%;cursor:pointer;flex-shrink:0;}
.tl-close{background:#ff5f57;border:0.5px solid rgba(220,60,40,0.4);}
.tl-min{background:#febc2e;border:0.5px solid rgba(200,150,0,0.4);}
.tl-max{background:#28c840;border:0.5px solid rgba(0,180,30,0.4);}
.tl-close:hover{background:#ff3b30;}
.window-title{font-size:13px;font-weight:500;color:#1a1a1a;flex:1;text-align:center;margin-right:52px;}
.window-body{flex:1;overflow-y:auto;padding:20px;}
.window-body::-webkit-scrollbar{width:6px;}
.window-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.2);border-radius:3px;}
.about-content{display:flex;flex-direction:column;gap:16px;}
.about-header{display:flex;align-items:center;gap:16px;}
.about-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#4a7c59,#2d5a3d);display:flex;align-items:center;justify-content:center;font-size:28px;color:white;font-weight:600;flex-shrink:0;}
.about-name{font-size:22px;font-weight:600;color:#1a1a1a;}
.about-role{font-size:14px;color:#666;margin-top:3px;}
.about-bio{font-size:14px;color:#333;line-height:1.75;}
.tag{background:rgba(74,124,89,0.13);color:#2d5a3d;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;border:0.5px solid rgba(74,124,89,0.25);}
.project-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.project-card{background:white;border-radius:10px;overflow:hidden;border:0.5px solid rgba(0,0,0,0.08);cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;}

.pcover{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#f0f0ec;}
.pinfo{padding:12px 14px 14px;}
.ptype{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.9px;margin-bottom:5px;}
.ptype.d{color:#7c4dff;}.ptype.u{color:#0097a7;}.ptype.a{color:#e65100;}.ptype.g{color:#c0392b;}
.pname{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:4px;line-height:1.3;}
.pdesc{font-size:11px;color:#666;line-height:1.55;}
.contact-link{display:flex;align-items:center;gap:6px;padding:8px 14px;background:white;border-radius:8px;border:0.5px solid rgba(0,0,0,0.12);font-size:13px;color:#333;cursor:pointer;transition:background 0.12s;text-decoration:none;}
.contact-link:hover{background:#f0f0ec;}
.contact-form{display:flex;flex-direction:column;gap:12px;max-width:420px;}
.contact-form label{font-size:11px;font-weight:600;color:#666;margin-bottom:3px;display:block;text-transform:uppercase;letter-spacing:0.5px;}
.contact-form input,.contact-form textarea{width:100%;padding:8px 12px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.18);background:white;font-size:13px;font-family:inherit;outline:none;}
.contact-form input:focus,.contact-form textarea:focus{border-color:#4a7c59;box-shadow:0 0 0 2px rgba(74,124,89,0.12);}
.contact-form textarea{height:90px;resize:none;}
.send-btn{background:#2d5a3d;color:white;border:none;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;align-self:flex-start;}
.send-btn:hover{background:#4a7c59;}
.resume-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#4a7c59;border-bottom:1px solid rgba(74,124,89,0.18);padding-bottom:5px;margin-bottom:10px;}
.resume-item{margin-bottom:14px;}
.resume-item-header{display:flex;justify-content:space-between;align-items:baseline;}
.resume-item-title{font-size:14px;font-weight:600;color:#1a1a1a;}
.resume-item-date{font-size:11px;color:#999;}
.resume-item-sub{font-size:12px;color:#666;margin:2px 0;}
.resume-item-desc{font-size:12px;color:#777;line-height:1.6;margin-top:4px;}
.archive-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.archive-item{border-radius:8px;overflow:hidden;cursor:pointer;border:0.5px solid rgba(0,0,0,0.08);transition:transform 0.12s;}
.archive-item:hover{transform:scale(1.03);}
.archive-thumb{width:100%;height:90px;display:flex;align-items:center;justify-content:center;font-size:32px;}
.archive-label{font-size:11px;padding:6px 8px;background:white;color:#444;}
.music-app{display:flex;height:100%;background:#1c1c1e;}
.music-sidebar{width:175px;background:#2c2c2e;padding:12px 0;flex-shrink:0;border-right:0.5px solid rgba(255,255,255,0.07);}
.music-sidebar-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.9px;color:#666;padding:8px 16px 4px;}
.music-sidebar-item{display:flex;align-items:center;gap:8px;padding:6px 16px;font-size:13px;color:#ccc;cursor:pointer;transition:background 0.1s;}
.music-sidebar-item:hover{background:rgba(255,255,255,0.07);}
.music-sidebar-item.active{background:rgba(255,255,255,0.11);color:white;}
.music-main{flex:1;padding:20px;overflow-y:auto;}
.music-main::-webkit-scrollbar{width:4px;}
.music-main::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
.music-header{font-size:22px;font-weight:700;color:white;margin-bottom:16px;}
.playlist-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.playlist-card{border-radius:10px;overflow:hidden;cursor:pointer;transition:transform 0.15s;position:relative;}
.playlist-card:hover{transform:scale(1.04);}
.playlist-cover{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:52px;}
.playlist-info{padding:8px 10px 10px;background:#2c2c2e;}
.playlist-name{font-size:13px;font-weight:600;color:white;}
.playlist-count{font-size:11px;color:#777;margin-top:2px;}

.playlist-card:hover .play-overlay{opacity:1;}
.play-btn-circle{width:46px;height:46px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;padding-left:3px;}
.songs-back{display:flex;align-items:center;gap:4px;color:#fc3c44;font-size:13px;cursor:pointer;margin-bottom:16px;}
.songs-back:hover{text-decoration:underline;}
.songs-header{display:flex;gap:16px;margin-bottom:20px;align-items:flex-end;}
.songs-cover{width:100px;height:100px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:50px;flex-shrink:0;}
.songs-title{font-size:20px;font-weight:700;color:white;}
.songs-subtitle{font-size:12px;color:#777;margin-top:4px;}
.song-row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:6px;cursor:pointer;transition:background 0.1s;}
.song-row:hover{background:rgba(255,255,255,0.08);}
.song-num{font-size:13px;color:#666;width:22px;text-align:center;flex-shrink:0;}
.song-info{flex:1;}
.song-name{font-size:13px;color:white;font-weight:500;}
.song-artist{font-size:11px;color:#777;margin-top:1px;}
.song-dur{font-size:12px;color:#666;flex-shrink:0;}
.song-playing{color:#fc3c44!important;}
.nowplaying-bar{height:72px;background:#2c2c2e;border-top:0.5px solid rgba(255,255,255,0.07);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;}
.np-cover{width:42px;height:42px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.np-info{flex:1;}
.np-song{font-size:12px;font-weight:600;color:white;}
.np-artist{font-size:11px;color:#777;margin-top:1px;}
.np-controls{display:flex;align-items:center;gap:18px;}
.np-btn{background:none;border:none;color:#aaa;font-size:18px;cursor:pointer;padding:4px;line-height:1;transition:color 0.1s;}
.np-btn:hover{color:white;}
.np-play{font-size:24px;color:white;}

/* Project Preview */

.preview-toolbar{height:44px;background:#2a2a2a;display:flex;align-items:center;justify-content:center;gap:20px;flex-shrink:0;border-bottom:0.5px solid rgba(255,255,255,0.08);}
.preview-nav-btn{background:rgba(255,255,255,0.1);border:none;color:white;width:28px;height:28px;border-radius:6px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.1s;}
.preview-nav-btn:hover{background:rgba(255,255,255,0.2);}

.preview-filmstrip{height:100px;background:#252525;display:flex;align-items:center;gap:6px;padding:10px 14px;overflow-x:auto;flex-shrink:0;border-top:0.5px solid rgba(255,255,255,0.08);}
.preview-filmstrip::-webkit-scrollbar{height:3px;}
.preview-filmstrip::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:2px;}
.filmstrip-item{height:74px;min-width:120px;border-radius:4px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border-color 0.15s;flex-shrink:0;background:#333;display:flex;align-items:center;justify-content:center;}
.filmstrip-item.active{border-color:#0a84ff;}
.filmstrip-item img{width:100%;height:100%;object-fit:cover;}
.filmstrip-item .video-thumb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1a1a2e;color:white;font-size:22px;}
.preview-sidebar{width:260px;background:#f5f5f1;border-left:0.5px solid rgba(0,0,0,0.12);display:flex;flex-direction:column;padding:24px 20px;gap:12px;overflow-y:auto;flex-shrink:0;}
.preview-sidebar-title{font-size:20px;font-weight:700;color:#1a1a1a;line-height:1.3;}
.preview-sidebar-type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.9px;color:#888;margin-bottom:4px;}
.preview-sidebar-section{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#4a7c59;margin-top:8px;}
.preview-sidebar-desc{font-size:13px;color:#444;line-height:1.75;}
.preview-divider{height:0.5px;background:rgba(0,0,0,0.1);}
</style>

<script>
const clockEl=document.getElementById('clock');
const dateEl=document.getElementById('menudate');
function updateClock(){
  const n=new Date();
  clockEl.textContent=n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  dateEl.textContent=n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
updateClock();setInterval(updateClock,1000);

function renderPlaylists(){
  if(currentPlaylist!==null){
    const pl=playlists[currentPlaylist];
    return`<div class="music-app"><div class="music-sidebar"><div class="music-sidebar-section">Library</div><div class="music-sidebar-item active">🎵 Playlists</div><div class="music-sidebar-item">🎤 Artists</div><div class="music-sidebar-item">💿 Albums</div><div class="music-sidebar-item">🎵 Songs</div></div><div style="flex:1;display:flex;flex-direction:column;overflow:hidden"><div class="music-main"><div class="songs-back" onclick="currentPlaylist=null;refreshMusic()">← Playlists</div><div class="songs-header"><div class="songs-cover" style="background:${pl.color}">${pl.emoji}</div><div><div class="songs-title">${pl.name}</div><div class="songs-subtitle">${pl.songs.length} songs · by Fioana</div></div></div>${pl.songs.map((s,i)=>`<div class="song-row" onclick="playSong(${currentPlaylist},${i})"><div class="song-num ${playingSong===currentPlaylist+'-'+i?'song-playing':''}">${playingSong===currentPlaylist+'-'+i&&isPlaying?'♪':i+1}</div><div class="song-info"><div class="song-name ${playingSong===currentPlaylist+'-'+i?'song-playing':''}">${s.name}</div><div class="song-artist">${s.artist}</div></div><div class="song-dur">${s.dur}</div></div>`).join('')}</div>${renderNowPlaying()}</div></div>`;
  }
  return`<div class="music-app"><div class="music-sidebar"><div class="music-sidebar-section">Library</div><div class="music-sidebar-item active">🎵 Playlists</div><div class="music-sidebar-item">🎤 Artists</div><div class="music-sidebar-item">💿 Albums</div><div class="music-sidebar-item">🎵 Songs</div></div><div style="flex:1;display:flex;flex-direction:column;overflow:hidden"><div class="music-main"><div class="music-header">Playlists</div><div class="playlist-grid">${playlists.map((pl,i)=>`<div class="playlist-card" onclick="currentPlaylist=${i};refreshMusic()"><div class="playlist-cover" style="background:${pl.color}">${pl.emoji}</div><div class="playlist-info"><div class="playlist-name">${pl.name}</div><div class="playlist-count">${pl.songs.length} songs</div></div><div class="play-overlay"><div class="play-btn-circle">▶</div></div></div>`).join('')}</div></div>${renderNowPlaying()}</div></div>`;
}

function renderNowPlaying(){
  if(!playingSong)return`<div class="nowplaying-bar"><div style="color:#555;font-size:13px">Not playing</div></div>`;
  const[pli,si]=playingSong.split('-').map(Number);const s=playlists[pli].songs[si];
  return`<div class="nowplaying-bar"><div class="np-cover" style="background:${playlists[pli].color}">${playlists[pli].emoji}</div><div class="np-info"><div class="np-song">${s.name}</div><div class="np-artist">${s.artist}</div></div><div class="np-controls"><button class="np-btn">⏮</button><button class="np-btn np-play" onclick="togglePlay();event.stopPropagation()">${isPlaying?'⏸':'▶'}</button><button class="np-btn">⏭</button></div></div>`;
}

function playSong(pli,si){playingSong=pli+'-'+si;isPlaying=true;refreshMusic();}
function togglePlay(){isPlaying=!isPlaying;refreshMusic();}
function refreshMusic(){if(activeWindows['playlists']){activeWindows['playlists'].querySelector('.window-body').innerHTML=renderPlaylists();}}

const windowConfig={
  about:{title:'About Me',width:520,height:420},
  projects:{title:'Projects',width:820,height:560},
  resume:{title:'Resume',width:540,height:500},
  contact:{title:'Contact Me',width:480,height:420},

function openWindow(type){
  if(activeWindows[type]){activeWindows[type].style.zIndex=++windowZ;return;}
  const cfg=windowConfig[type];
  const isMusic=type==='playlists';
  const win=document.createElement('div');
  win.className='window';
  win.style.cssText=`width:${cfg.width}px;left:${160+Math.random()*280}px;top:${44+Math.random()*80}px;`;
  win.style.zIndex=++windowZ;
  win.innerHTML=`<div class="window-titlebar"><div class="traffic-lights"><div class="tl tl-close" onclick="closeWindow('${type}')"></div><div class="tl tl-min"></div><div class="tl tl-max"></div></div><div class="window-title">${cfg.title}</div></div><div class="window-body" style="${isMusic?'padding:0;display:flex;flex-direction:column;height:'+cfg.height+'px;overflow:hidden':''}">${getContent(type)}</div>`;
  document.getElementById('windows-container').appendChild(win);
  activeWindows[type]=win;
  win.querySelector('.window-titlebar').addEventListener('mousedown',e=>startDrag(win,e));
  win.addEventListener('mousedown',()=>win.style.zIndex=++windowZ);
}

function closeWindow(type){
  if(activeWindows[type]){activeWindows[type].remove();delete activeWindows[type];if(type==='playlists')currentPlaylist=null;}
}

function startDrag(win,e){
  if(e.target.classList.contains('tl'))return;
  const sx=e.clientX-win.offsetLeft,sy=e.clientY-win.offsetTop;
  const onMove=e=>{win.style.left=(e.clientX-sx)+'px';win.style.top=Math.max(28,e.clientY-sy)+'px';};
  const onUp=()=>{document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function renderMedia(m){
  if(!m)return'';
  if(m.type==='youtube')return`<iframe src="${m.src}" style="width:100%;height:100%;border:none;border-radius:4px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  if(m.type==='video')return`<video src="${m.src}" controls style="max-width:100%;max-height:100%;border-radius:4px;"></video>`;
  if(m.type==='pdf')return`<iframe src="${m.src}" style="width:100%;height:100%;border:none;border-radius:4px;"></iframe>`;
  return`<img src="${m.src}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;">`;
}

function previewNav(id,key,dir){
  const p=projectData[key];
  const wins=activeWindows[id];if(!wins)return;
  currentProjectIndex=Math.max(0,Math.min(p.media.length-1,currentProjectIndex+dir));
  previewJump(id,key,currentProjectIndex);
}

function previewJump(id,key,idx){
  const p=projectData[key];
  currentProjectIndex=idx;
  const content=document.getElementById('content-'+id);
  const counter=document.getElementById('counter-'+id);
  if(content)content.innerHTML=renderMedia(p.media[idx]);
  if(counter)counter.textContent=`${idx+1} / ${p.media.length}`;
  document.querySelectorAll(`[id^="thumb-${id}-"]`).forEach((el,i)=>{
    el.classList.toggle('active',i===idx);
  });
}
